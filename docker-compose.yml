x-api: &api
  build:
    context: .
    dockerfile: Dockerfile
  image: imdeepmind-backend:local
  environment:
    NODE_ENV: production
    PORT: 3000
    HOST: 0.0.0.0
    DATABASE_URL: postgresql://devuser:devpassword@db:5432/imdeepmind
    JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-production}

services:
  migrate:
    <<: *api
    command: ["node", "build/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: imdeepmind
    ports:
      # 5433 on the host so it does not clash with a local Postgres.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
